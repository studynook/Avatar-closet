```html
<!DOCTYPE html>
<html>

<head>

    <title>My Avatar Closet</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3ef;
            color: #333;
        }

        header {
            text-align: center;
            padding: 30px 20px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            color: #777;
        }


        /* =========================
           MAIN LAYOUT
        ========================== */

        .closet {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 50px;
            padding: 20px;
        }


        /* =========================
           AVATAR
        ========================== */

        .avatar-area {
            width: 450px;
            text-align: center;
        }

        .avatar-container {
            position: relative;
            width: 400px;
            margin: auto;
        }

        .avatar-base {
            width: 100%;
            display: block;
            position: relative;
            z-index: 0;
        }


        /* ALL CLOTHING GOES ABOVE THE BODY */

        .avatar-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        #bottom-layer {
            z-index: 2;
        }

        #top-layer {
            z-index: 3;
        }

        #hair-layer {
            z-index: 4;
        }

        #accessory-layer {
            z-index: 5;
        }


        /* =========================
           CLOSET PANEL
        ========================== */

        .closet-panel {
            width: 360px;
            background: white;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }


        /* =========================
           CATEGORY BUTTONS
        ========================== */

        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .category-button {
            border: none;
            padding: 12px;
            border-radius: 12px;
            background: #eeeeee;
            cursor: pointer;
            font-size: 15px;
        }

        .category-button:hover {
            background: #dddddd;
        }

        .category-button.active {
            background: #333;
            color: white;
        }


        /* =========================
           CLOTHING ITEMS
        ========================== */

        .items {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .item {
            border: 2px solid #eeeeee;
            border-radius: 15px;
            padding: 15px 5px;
            background: white;
            cursor: pointer;
            text-align: center;
        }

        .item:hover {
            border-color: #aaa;
        }

        .item-icon {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .item-name {
            font-size: 12px;
        }


        /* =========================
           REMOVE BUTTON
        ========================== */

        .remove-button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: #eeeeee;
            cursor: pointer;
            font-size: 14px;
        }

        .remove-button:hover {
            background: #dddddd;
        }


        /* =========================
           TEST CLOTHING
        ========================== */

        .test-clothing {
            position: absolute;
            display: none;
            z-index: 2;
        }


        /* =========================
           TEST TOPS
        ========================== */

        .pink-top {
            top: 38%;
            left: 27%;
            width: 46%;
            height: 24%;
            background: pink;
            border-radius: 18px 18px 12px 12px;
        }

        .blue-top {
            top: 37%;
            left: 26%;
            width: 48%;
            height: 25%;
            background: lightblue;
            border-radius: 15px 15px 10px 10px;
        }

        .purple-top {
            top: 36%;
            left: 25%;
            width: 50%;
            height: 27%;
            background: plum;
            border-radius: 20px;
        }


        /* =========================
           TEST BOTTOMS
        ========================== */

        .jeans {
            top: 57%;
            left: 29%;
            width: 42%;
            height: 28%;
            background: #7899c4;
            border-radius: 8px;
        }

        .skirt {
            top: 57%;
            left: 25%;
            width: 50%;
            height: 23%;
            background: #d6a6b8;
            border-radius: 5px 5px 25px 25px;
        }


        /* =========================
           MOBILE / IPAD
        ========================== */

        @media (max-width: 800px) {

            .closet {
                flex-direction: column;
                align-items: center;
            }

            .avatar-area {
                width: 100%;
            }

            .avatar-container {
                width: 320px;
            }

            .closet-panel {
                width: 100%;
                max-width: 360px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>My Avatar Closet 👗</h1>

    <p>Mix and match your clothes!</p>

</header>



<div class="closet">


    <!-- =========================
         AVATAR
    ========================== -->

    <div class="avatar-area">

        <div class="avatar-container">


            <!-- BASE AVATAR -->

            <img
                class="avatar-base"
                src="https://i.postimg.cc/ZnFsYRbG/IMG-3250.png"
                alt="Avatar"
            >


            <!-- =========================
                 TEST CLOTHING
            ========================== -->


            <!-- TOPS -->

            <div
                id="pink-top"
                class="test-clothing pink-top">
            </div>

            <div
                id="blue-top"
                class="test-clothing blue-top">
            </div>

            <div
                id="purple-top"
                class="test-clothing purple-top">
            </div>


            <!-- BOTTOMS -->

            <div
                id="jeans"
                class="test-clothing jeans">
            </div>

            <div
                id="skirt"
                class="test-clothing skirt">
            </div>


        </div>

    </div>



    <!-- =========================
         CLOSET PANEL
    ========================== -->

    <div class="closet-panel">


        <!-- CATEGORIES -->

        <div class="categories">

            <button
                class="category-button active"
                onclick="showCategory('tops', this)">

                Tops

            </button>


            <button
                class="category-button"
                onclick="showCategory('bottoms', this)">

                Bottoms

            </button>

        </div>



        <!-- ITEMS -->

        <div
            id="items"
            class="items">
        </div>



        <!-- REMOVE -->

        <button
            class="remove-button"
            onclick="removeCurrentItem()">

            Remove Current Item

        </button>


    </div>

</div>



<script>


/* =========================
   CLOTHING DATA
========================= */


const clothing = {


    tops: [

        {
            name: "Pink Top",
            icon: "👕",
            id: "pink-top"
        },

        {
            name: "Blue Top",
            icon: "👚",
            id: "blue-top"
        },

        {
            name: "Purple Top",
            icon: "🧥",
            id: "purple-top"
        }

    ],


    bottoms: [

        {
            name: "Jeans",
            icon: "👖",
            id: "jeans"
        },

        {
            name: "Skirt",
            icon: "👗",
            id: "skirt"
        }

    ]

};



/* =========================
   CURRENT CATEGORY
========================= */

let currentCategory = "tops";



/* =========================
   SHOW CATEGORY
========================= */

function showCategory(category, button) {

    currentCategory = category;


    document
        .querySelectorAll(".category-button")
        .forEach(function(btn) {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    displayItems(category);

}



/* =========================
   DISPLAY ITEMS
========================= */

function displayItems(category) {

    const container =
        document.getElementById("items");


    container.innerHTML = "";


    clothing[category].forEach(function(item) {


        const button =
            document.createElement("div");


        button.className = "item";


        button.innerHTML = `

            <div class="item-icon">
                ${item.icon}
            </div>

            <div class="item-name">
                ${item.name}
            </div>

        `;


        button.onclick = function() {

            equipItem(category, item);

        };


        container.appendChild(button);

    });

}



/* =========================
   EQUIP ITEM
========================= */

function equipItem(category, item) {


    /*
       Remove other items from
       the SAME category only.
    */

    clothing[category].forEach(function(clothingItem) {

        document
            .getElementById(clothingItem.id)
            .style.display = "none";

    });


    /*
       Show selected item.
    */

    document
        .getElementById(item.id)
        .style.display = "block";

}



/* =========================
   REMOVE CURRENT CATEGORY
========================= */

function removeCurrentItem() {


    clothing[currentCategory].forEach(function(item) {

        document
            .getElementById(item.id)
            .style.display = "none";

    });

}



/* =========================
   START WITH TOPS
========================= */

displayItems("tops");


</script>


</body>

</html>
```
