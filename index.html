<!DOCTYPE html>
<html>
<head>

    <title>Avatar Closet</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f7f3ef;
            margin: 0;
            padding: 30px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .closet {
            display: flex;
            justify-content: center;
            gap: 50px;
            align-items: flex-start;
        }

        /* Avatar area */

        .avatar-area {
            width: 450px;
        }

        .avatar-container {
            position: relative;
            width: 400px;
            margin: auto;
        }

        /* Every clothing layer uses the exact same position */

        .avatar-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* Base avatar */

        .avatar-base {
            position: relative;
            width: 100%;
            display: block;
        }

        /* Closet */

        .closet-menu {
            width: 250px;
            background: white;
            padding: 20px;
            border-radius: 20px;
        }

        .closet-menu h2 {
            margin-top: 0;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            background: #eeeeee;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #dddddd;
        }

    </style>

</head>


<body>

    <h1>My Avatar Closet 👗</h1>


    <div class="closet">


        <!-- AVATAR -->

        <div class="avatar-area">

            <div class="avatar-container">

                <!-- BODY -->

                <img
                    class="avatar-base"
                    src="https://i.postimg.cc/ZnFsYRbG/IMG-3250.png"
                    alt="Avatar"
                >


                <!-- CLOTHING LAYERS -->

                <img
                    id="bottom-layer"
                    class="avatar-layer"
                    style="display: none;"
                >

                <img
                    id="top-layer"
                    class="avatar-layer"
                    style="display: none;"
                >

                <img
                    id="hair-layer"
                    class="avatar-layer"
                    style="display: none;"
                >

                <img
                    id="accessory-layer"
                    class="avatar-layer"
                    style="display: none;"
                >

            </div>

        </div>


        <!-- CLOSET -->

        <div class="closet-menu">

            <h2>Test Closet</h2>

            <button onclick="testTop()">
                Test Top
            </button>

            <button onclick="removeTop()">
                Remove Top
            </button>

        </div>

    </div>


    <script>

        /*
        This is our clothing system.

        Later, the image source here can be
        replaced with an AI-generated clothing image.
        */


        function testTop() {

            const top = document.getElementById("top-layer");

            top.src = "https://dummyimage.com/400x400/ffb6c1/ffffff&text=TEST+TOP";

            top.style.display = "block";

        }


        function removeTop() {

            const top = document.getElementById("top-layer");

            top.style.display = "none";

        }

    </script>


</body>

</html>
